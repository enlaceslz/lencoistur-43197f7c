gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 256;
gzip_comp_level 5;
gzip_vary on;

brotli on;
brotli_comp_level 6;
brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/octet-stream;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=realtime:10m rate=30r/s;

# Upstream configurável via env (default: supabase-kong:8000)
upstream supabase_backend {
    server ${SUPABASE_KONG_HOST}:${SUPABASE_KONG_PORT};
}

map $sent_http_content_type $expires_map {
    default                                    off;
    ~*\.(css|js|mjs)$                          1y;
    ~*\.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$  1d;
}

# Security + CSP headers (snippet - incluir em todo location com add_header)
include /etc/nginx/conf.d/security-headers.conf;

# Herança: sem add_header proprio no server, os locations de proxy herdam estes.
# Locations que definem add_header proprio precisam do include acima (via include).

server {
    listen 80;
    server_name www.lencois.tur.br;
    return 301 https://lencois.tur.br$request_uri;
}

server {
    listen 80 default_server;
    server_name lencois.tur.br;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Supabase API proxy
    # Nota: ^~ garante precedência sobre os locations regex de assets abaixo,
    # pois URLs do storage terminam em .jpg/.png e seriam capturadas pelo regex.
    location ^~ /auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://supabase_backend/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /rest/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://supabase_backend/rest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /storage/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://supabase_backend/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /realtime/ {
        limit_req zone=realtime burst=50 nodelay;
        proxy_pass http://supabase_backend/realtime/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Supabase Edge Functions
    location ^~ /functions/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://supabase_backend/functions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Text assets: aggressive caching, immutable
    location ~* \.(?:css|js|mjs)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        expires 1y;
        try_files $uri =404;
    }

    # Image/font assets
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        expires 1y;
        try_files $uri =404;
    }

    # Index.html: never cache
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # Health check endpoint
    location = /health {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 200 "healthy\n";
    }

    # SPA fallback
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        include /etc/nginx/conf.d/security-headers.conf;
        root /usr/share/nginx/html;
    }
}